# Two-node HA environment used by tests/test-ha-failover.sh.
#
# Each node puts its agent in the database's network namespace, so Postgres and
# the agent answer on one address — the same shape as a real deployment where a
# server publishes both ports. Nothing is published to the host: the test drives
# everything from the `client` container inside the network.

name: hatest

x-pg-env: &pg-env
  POSTGRES_HOST: /var/run/postgresql
  POSTGRES_PASSWORD: ${HA_TEST_PG_PASSWORD:-testpass}
  PGPASSWORD: ${HA_TEST_PG_PASSWORD:-testpass}
  POSTGRES_DB: postgres
  PGPORT: 5432
  POSTGRES_PORT: 5432
  JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
  JWT_EXP: 3600

x-agent-env: &agent-env
  HA_PG_PORT: 5432
  HA_PG_USER: postgres
  HA_PG_PASSWORD: ${HA_TEST_PG_PASSWORD:-testpass}
  HA_PG_DATABASE: postgres
  HA_API_TOKEN: ${HA_TEST_TOKEN:-testtoken}
  HA_LOG_LEVEL: ${HA_TEST_LOG_LEVEL:-INFO}

x-db: &db
  image: ${HA_TEST_IMAGE:-supabase/postgres:17.6.1.136}
  environment: *pg-env
  command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
    interval: 3s
    timeout: 3s
    retries: 30

services:
  primary-db:
    <<: *db
    volumes:
      - primary-data:/var/lib/postgresql/data

  primary-agent:
    build: ../ha
    network_mode: "service:primary-db"
    restart: unless-stopped
    depends_on:
      primary-db: {condition: service_healthy}
    environment:
      <<: *agent-env
      HA_NODE_NAME: primary
      HA_PG_HOST: 127.0.0.1

  standby-bootstrap:
    image: ${HA_TEST_IMAGE:-supabase/postgres:17.6.1.136}
    user: root
    restart: "no"
    depends_on:
      primary-db: {condition: service_healthy}
    volumes:
      - standby-data:/var/lib/postgresql/data
      - ../ha/bootstrap-standby.sh:/bootstrap-standby.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-standby.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      HA_NODE_NAME: standby
      HA_PRIMARY_HOST: primary-db
      HA_PRIMARY_PORT: 5432
      HA_REPLICATION_PASSWORD: ${HA_TEST_REPL_PASSWORD:-replpass}
      HA_BOOTSTRAP_TIMEOUT: 180

  standby-db:
    <<: *db
    volumes:
      - standby-data:/var/lib/postgresql/data
    depends_on:
      standby-bootstrap: {condition: service_completed_successfully}

  standby-agent:
    build: ../ha
    network_mode: "service:standby-db"
    restart: unless-stopped
    depends_on:
      standby-db: {condition: service_healthy}
    environment:
      <<: *agent-env
      HA_NODE_NAME: standby
      HA_PG_HOST: 127.0.0.1
      HA_PRIMARY_HOST: primary-db
      HA_PRIMARY_PORT: 5432
      HA_FAILOVER_MODE: ${HA_TEST_FAILOVER_MODE:-auto}
      HA_WITNESS_URLS: http://witness:8008
      HA_CHECK_INTERVAL: 2
      HA_FAILURE_THRESHOLD: 3

  # An independent third opinion, so the standby can tell a dead primary from
  # a link failure between the two nodes.
  witness:
    build: ../ha
    restart: unless-stopped
    environment:
      <<: *agent-env
      HA_NODE_NAME: witness
      HA_ROLE: witness

  router:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    volumes:
      - ../ha/render-haproxy.sh:/usr/local/bin/render-haproxy.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/render-haproxy.sh"]
    environment:
      HA_NODES: primary=primary-db:5432:8008,standby=standby-db:5432:8008
      HA_ROUTER_PORT: 5432
      HA_ROUTER_READ_PORT: 5433
      HA_ROUTER_CHECK_INTERVAL: 1s
      HA_ROUTER_CHECK_FALL: 2

  # Drives the test from inside the network, the way an application would.
  client:
    image: ${HA_TEST_IMAGE:-supabase/postgres:17.6.1.136}
    entrypoint: ["sleep", "infinity"]

volumes:
  primary-data:
  standby-data:
